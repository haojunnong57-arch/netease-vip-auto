name: netease-daily

on:
  schedule:
    - cron: "10 0 * * *"      # 北京时间 08:10
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install --quiet requests pycryptodome

      # 凭证来源二选一：
      #   A. 仓库 Settings 里的 Secrets（推荐）
      #   B. .github/cookie.env 文件（私有仓库才这么干，方便手机端维护）
      - name: load credentials
        run: |
          if [ -f .github/cookie.env ]; then
            set -a
            . .github/cookie.env
            set +a
            echo "MUSIC_U=$MUSIC_U" >> "$GITHUB_ENV"
            echo "MUSIC_A=$MUSIC_A" >> "$GITHUB_ENV"
            echo "CSRF=$CSRF" >> "$GITHUB_ENV"
            echo "凭证来源: cookie.env"
          else
            echo "MUSIC_U=${{ secrets.MUSIC_U }}" >> "$GITHUB_ENV"
            echo "MUSIC_A=${{ secrets.MUSIC_A }}" >> "$GITHUB_ENV"
            echo "CSRF=${{ secrets.CSRF }}" >> "$GITHUB_ENV"
            echo "凭证来源: secrets"
          fi

      - name: run daily tasks
        run: python netease_daily.py
