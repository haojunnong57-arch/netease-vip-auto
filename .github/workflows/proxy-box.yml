name: proxy-box

# 24 小时自动接力代理
# 机制：每 5 小时自动重开一次（单次跑 350 分钟），并把最新 VLESS 链接写进 sub/subscription.txt
# 客户端只需订阅一次 raw 地址，之后自动跟着更新，不用再手动复制链接

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "保持时长（分钟，最大 350）"
        required: false
        default: "350"
  schedule:
    - cron: "0 */5 * * *"     # 每 5 小时接力一次

permissions:
  contents: write

concurrency:
  group: proxy-box
  cancel-in-progress: true     # 新的一轮直接顶掉旧的，几乎无缝

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 装 xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install >/dev/null 2>&1
          /usr/local/bin/xray version | head -1

      - name: 装 cloudflared
        run: |
          curl -sL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: 起代理 + 隧道
        run: |
          UUID="$(cat /proc/sys/kernel/random/uuid)"
          P="/$(head -c 8 /dev/urandom | base64 | tr -dc 'a-z0-9')"
          sudo tee /usr/local/etc/xray/config.json >/dev/null <<EOF
          {
            "log": {"loglevel": "warning"},
            "inbounds": [{
              "port": 8080, "listen": "127.0.0.1", "protocol": "vless",
              "settings": {"clients": [{"id": "$UUID"}], "decryption": "none"},
              "streamSettings": {"network": "ws", "wsSettings": {"path": "$P"}}
            }],
            "outbounds": [{"protocol": "freedom", "settings": {}}]
          }
          EOF
          sudo systemctl restart xray || (sudo /usr/local/bin/xray run -c /usr/local/etc/xray/config.json &)
          sleep 3

          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > /tmp/cf.log 2>&1 &
          HOST=""
          for i in $(seq 1 30); do
            sleep 2
            HOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$HOST" ] && break
          done
          [ -z "$HOST" ] && { echo "隧道起不来"; tail -20 /tmp/cf.log; exit 1; }
          DOMAIN=${HOST#https://}

          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          echo "P=$P" >> $GITHUB_ENV

          LINK="vless://${UUID}@${DOMAIN}:443?encryption=none&security=tls&sni=${DOMAIN}&type=ws&host=${DOMAIN}&path=${P//\//%2F}#gh-box"
          echo "================ 代理就绪 ================"
          echo "$LINK"
          echo "=========================================="

          mkdir -p sub
          printf '%s' "$LINK" | base64 | tr -d '\n' > sub/subscription.txt
          echo "订阅文件已生成"

      - name: 发布订阅（客户端拉这个）
        run: |
          git config user.email "actions@github.com"
          git config user.name "proxy-bot"
          git add sub/subscription.txt
          git commit -m "sub: $(date -u +%FT%TZ)" || echo "无变化"
          git push || echo "推送失败"

      - name: 保活
        run: |
          MIN=${{ fromJSON(github.event.inputs.minutes || '350') }}
          for i in $(seq 1 $MIN); do
            sleep 60
            if [ $((i % 30)) -eq 0 ]; then echo "[$i/$MIN] 存活, 域名 $DOMAIN"; fi
          done
